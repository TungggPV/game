<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Armor: Hào Quang Giáp</title>
    <link rel="icon" type="image/png" href="/assets/hero/portrait/hero_portrait.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="stage" aria-label="Element Armor game">
        <div id="gameMount" tabindex="0"></div>
      </section>

      <nav class="touch-controls" aria-label="Điều khiển cảm ứng">
        <div class="touch-cluster">
          <button data-touch-action="left" aria-label="Sang trái" type="button">‹</button>
          <button data-touch-action="jump" aria-label="Nhảy" type="button">⌃</button>
          <button data-touch-action="right" aria-label="Sang phải" type="button">›</button>
        </div>
        <div class="touch-cluster action-cluster">
          <button data-touch-action="dash" aria-label="Dash" type="button">⇢</button>
          <button data-touch-action="slash" aria-label="Chém" type="button">✦</button>
          <button data-touch-action="blast" aria-label="Bắn" type="button">✧</button>
        </div>
      </nav>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
