<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Element Armor: Hao Quang Giap</title>
    <link rel="icon" type="image/png" href="/assets/hero/portrait/hero_portrait.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="stage" aria-label="Element Armor game">
        <div id="gameMount" tabindex="0"></div>
      </section>

      <nav class="touch-controls" aria-label="Touch controls">
        <div class="touch-cluster">
          <button data-touch-action="left" aria-label="Left" type="button">&lt;</button>
          <button data-touch-action="jump" aria-label="Jump" type="button">^</button>
          <button data-touch-action="right" aria-label="Right" type="button">&gt;</button>
        </div>
        <div class="touch-cluster action-cluster">
          <button data-touch-action="dash" aria-label="Dash" type="button">D</button>
          <button data-touch-action="basic" aria-label="Basic attack" type="button">J</button>
          <button data-touch-action="skill1" aria-label="Skill 1" type="button">K</button>
          <button data-touch-action="skill2" aria-label="Skill 2" type="button">L</button>
          <button data-touch-action="ultimate" aria-label="Ultimate" type="button">U</button>
        </div>
      </nav>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
